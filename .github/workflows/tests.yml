name: Tests
# Runs on pull requests (main only takes merges of passing pull requests, so a run on push to main would repeat one),
# when a release reuses it, and by hand. A newer push to the same pull request cancels the run it supersedes.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The nodes use ComfyUI's V3 API (comfy_api), so the tests need a ComfyUI checkout on the path.
      - uses: actions/checkout@v4
        with:
          repository: comfyanonymous/ComfyUI
          path: ComfyUI
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r ComfyUI/requirements.txt
          python -m pip install pytest
      - name: Run tests, one family at a time
        env:
          PYTHONPATH: ${{ github.workspace }}/ComfyUI
        run: |
          status=0
          for d in tests/*/; do
            python -m pytest "$d" -q -p no:cacheprovider || status=1
          done
          exit $status
      - name: JavaScript syntax check
        run: |
          for f in $(find js -name '*.js'); do
            node --check --input-type=module < "$f"
          done
