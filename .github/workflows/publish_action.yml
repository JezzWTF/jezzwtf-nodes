name: Publish to Comfy registry

# A release is a version tag (v1.2.3) that matches pyproject.toml and sits on main. It runs the tests first and then
# waits for a maintainer to approve the `release` environment (Settings > Environments) before anything is published.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  publish-node:
    name: Publish Custom Node to registry
    needs: tests
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check this is a release of main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main; only commits that were merged into main can be released."
            exit 1
          fi
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in pyproject.toml."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" != "tag" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::run this workflow on main or on a version tag."
            exit 1
          fi
          echo "Releasing $version from $GITHUB_SHA"
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
