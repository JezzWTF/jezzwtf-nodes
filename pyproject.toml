[project]
name = "jezzwtf-nodes"
description = "JezzWTF quality-of-life nodes for ComfyUI: utilities, character chat and cards, LoRA and model loaders, MiniMax H3 RefMod, GIF tools, run timer and paste stack."
version = "1.1.0"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Operating System :: OS Independent",
    "Environment :: GPU :: NVIDIA CUDA",
]

[project.urls]
Repository = "https://github.com/JezzWTF/comfyui-jezzwtf-nodes"
"Bug Tracker" = "https://github.com/JezzWTF/comfyui-jezzwtf-nodes/issues"

[tool.comfy]
PublisherId = "jezzwtf"
DisplayName = "JezzWTF QoL Nodes"
Icon = "https://raw.githubusercontent.com/JezzWTF/comfyui-jezzwtf-nodes/main/assets/icon.svg"
requires-comfyui = ">=0.44.0"
